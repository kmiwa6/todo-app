<h2>📋 タスク一覧</h2>
<div class='form'>
  <input [(ngModel)]='newTask' placeholder='新しいタスクを入力...' />
  <button (click)='addTask()'>追加</button>
</div>
<ul>
  @for (task of tasks; track task.id) {
    <li>
      <input
        type="checkbox"
        [(ngModel)]="task.done"
        (change)="toggleDone(task)"
      />
      @if (editingID == task.id) {
        <input
        [(ngModel)]="editTitle"
        (keyup.enter)="saveTitle(task)"
        (keyup.escape)="cancelEdit()"
        />
        <button (click)="saveTitle(task)">保存</button>
        <button (click)="cancelEdit()">取消</button>
      }@else {
        <span>{{ task.title }}</span>
        <button (click)="startEdit(task)">編集</button>
      }

      <button (click)="deleteTask(task)">削除</button>
    </li>
  }
</ul>
